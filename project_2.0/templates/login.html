<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Конференции.РФ</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- ШАПКА -->
    <header class="site-header">
        <img src="/static/img/logo.jpg" alt="Конференции.РФ" class="auth-logo">
        <h1>Конференции.РФ</h1>
    </header>

    <!-- НАВИГАЦИЯ -->
    <nav class="site-nav">
        <a href="/login">Вход</a>
        <a href="/register">Регистрация</a>
    </nav>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="auth-container">
        <section>
            <h2>Вход</h2>

            {% if errors %}
                <div class="errors" data-testid="login-errors">
                    <ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
                </div>
            {% endif %}

            <form method="POST" action="/login" id="login-form" novalidate>
                <label for="login">Логин</label>
                <input type="text" id="login" name="login" data-testid="login-login" required>

                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" data-testid="login-password" required>

                <button type="submit" data-testid="login-submit">Войти</button>
            </form>

            <p class="switch-link">Еще не зарегистрированы? <a href="/register">Регистрация</a></p>
        </section>
    </main>

    <!-- ПОДВАЛ (footer) -->
    <footer class="site-footer">
        <div class="footer-socials">
            <img src="/static/img/wkok.png" alt="ВКонтакте и Одноклассники">
        </div>
        <p>© 2027 Конференции.РФ | ДЭ 09.02.07</p>
    </footer>

    <script src="/static/js/validation.js"></script>
</body>
</html>
